<!DOCTYPE html>
<html>
<head>
  <title>Service Dog Safety SMS Opt-In</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
      color: #222;
    }
    h1 {
      margin-bottom: 0.5rem;
    }
    form {
      margin-top: 1.5rem;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f9f9f9;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      max-width: 400px;
      padding: 0.5rem;
      margin-top: 0.25rem;
    }
    .checkbox {
      margin-top: 1rem;
    }
    .small {
      font-size: 0.95rem;
      color: #444;
      margin-top: 1rem;
    }
    .links {
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>Service Dog Safety SMS Opt-In</h1>
  <p>Service Dog Safety sends automated safety check-in and emergency notification messages.</p>

  <form>
    <label for="phone">Phone Number</label>
    <input type="text" id="phone" name="phone" placeholder="Enter your mobile phone number">

    <div class="checkbox">
      <input type="checkbox" id="consent" name="consent">
      <label for="consent" style="display:inline; font-weight:normal;">
        I agree to receive automated SMS safety check-in and emergency notification messages from Service Dog Safety.
      </label>
    </div>

    <p class="small">
      Message frequency may vary. Message and data rates may apply.
      Reply STOP to opt out. Reply HELP for assistance.
    </p>

    <p class="links">
      <a href="/privacy.html">Privacy Policy</a> |
      <a href="/terms.html">Terms &amp; Conditions</a>
    </p>
  </form>
</body>
</html>
